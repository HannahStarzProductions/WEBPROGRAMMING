
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Order Form</title>
</head>
<body>
    <h1>Coffee Order Form</h1>
    <form action="https://www.w3schools.com/action_page.php" method="get">
        <label for="customerName">Customer Name:</label><br>
        <input type="text" id="customerName" name="customerName" required><br><br>
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="coffeeType">Coffee Type:</label><br>
        <select id="coffeeType" name="coffeeType" required>
            <option value="latte">Latte</option>
            <option value="cappuccino">Cappuccino</option>
            <option value="americano">Americano</option>
            <option value="espresso">Espresso</option>
        </select><br><br>
        <label>Size:</label><br>
        <input type="radio" id="small" name="size" value="small" required>
        <label for="small">Small</label><br>
        <input type="radio" id="medium" name="size" value="medium">
        <label for="medium">Medium</label><br>
        <input type="radio" id="large" name="size" value="large">
        <label for="large">Large</label><br><br>
        <label>Extras:</label><br>
        <input type="checkbox" id="whippedCream" name="extras" value="whippedCream">
        <label for="whippedCream">Whipped Cream</label><br>
        <input type="checkbox" id="extraShot" name="extras" value="extraShot">
        <label for="extraShot">Extra Shot</label><br>
        <input type="checkbox" id="almondMilk" name="extras" value="almondMilk">
        <label for="almondMilk">Almond Milk</label><br><br>
        <label for="specialInstructions">Special Instructions:</label><br>
        <textarea id="specialInstructions" name="specialInstructions" rows="4" cols="50"></textarea><br><br>
        <input type="submit" value="Submit Order">
    </form>
</body>
</html>
